[project]
name = "grillme-backend"
version = "0.1.0"
description = "GrillMe FastAPI backend — auth, session CRUD, Postgres schema, MinIO."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.0.0",
    "minio>=7.2.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
